name: 🐛 Bug report
description: Report a problem with the bot
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        ⚠️ **Do not include your bot token, database credentials, or other secrets** in logs or screenshots.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run /gcreate …
        2. Click "Join"
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: Affected command(s) / component
      placeholder: "/gcreate, button gw:join, scheduler …"

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: "journalctl / console output. Redact all secrets."
      render: shell

  - type: input
    id: version
    attributes:
      label: Bot version / commit
      placeholder: "1.0.0 or commit SHA"
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "v22.x"

  - type: dropdown
    id: database
    attributes:
      label: Database
      options:
        - MariaDB
        - MySQL
        - Other

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed all secrets (token, DB credentials) from logs/screenshots.
          required: true
