name: CI

# Prüfung ohne Discord-Token. Läuft bei Pull Requests, ist manuell auslösbar und
# wird vom Deploy-Workflow als Gate wiederverwendet (workflow_call).
#
# Die Nebenläufigkeits-Tests brauchen eine echte Datenbank: sie prüfen, dass
# MariaDB ein bedingtes UPDATE serialisiert und ein doppeltes INSERT ablehnt.
# Dafür läuft ein MariaDB-Service-Container, getrennt von der Dummy-URL, die
# prisma validate/generate braucht.

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Dummy-URL: prisma validate/generate brauchen die Variable, aber keine echte DB.
      DATABASE_URL: "mysql://user:pass@localhost:3306/giveaway_bot"
      # Eigene DB für die Tests. Muss sich von DATABASE_URL unterscheiden, sonst
      # bricht scripts/test-db-setup.js ab.
      TEST_DATABASE_URL: "mysql://root:root@127.0.0.1:3306/giveaway_bot_test"
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: giveaway_bot_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate & generate
        run: |
          npx prisma validate
          npx prisma generate

      - name: i18n completeness check
        run: npm run i18n:check

      - name: Smoke test (Exporte + SlashCommand-Builder)
        run: npm run smoke

      - name: Syntax check (node --check)
        run: find src scripts tests deploy-commands.js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Migrate test database
        run: npm run test:db

      - name: Tests (Unit + Nebenläufigkeit)
        run: npm test
