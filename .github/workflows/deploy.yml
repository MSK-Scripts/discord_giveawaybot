name: Deploy

# Bei jedem Push auf main: erst prüfen (verify aus ci.yml), dann per SSH auf den
# Debian-Server deployen und den systemd-Dienst neu starten.
# Manuell auslösbar via "Run workflow".

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Gate: derselbe verify-Job wie für PRs (prisma validate/generate, i18n, smoke, node --check).
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -euo pipefail
            REPO="https://github.com/MSK-Scripts/discord_giveawaybot.git"
            mkdir -p /opt/discord_giveaway
            cd /opt/discord_giveaway

            # Selbstheilend: Verzeichnis ggf. als Git-Repo initialisieren und hart
            # auf origin/main setzen — funktioniert auch beim ersten Deploy bzw.
            # wenn /opt/discord_giveaway (noch) kein Clone war.
            # .env und node_modules bleiben dabei erhalten.
            git config --global --add safe.directory /opt/discord_giveaway 2>/dev/null || true
            git init -q
            git remote get-url origin >/dev/null 2>&1 \
              && git remote set-url origin "$REPO" \
              || git remote add origin "$REPO"
            git fetch --depth=1 origin main
            git reset --hard origin/main
            git clean -dfx -e .env -e node_modules

            # Prod-.env muss vorhanden sein (wird bewusst NIE aus Git übertragen).
            if [ ! -f .env ]; then
              echo "ERROR: /opt/discord_giveaway/.env fehlt — bitte Prod-.env anlegen (siehe DEPLOYMENT.md)."
              exit 1
            fi

            # Volle Installation: das prisma-CLI ist devDependency und wird für
            # generate/migrate gebraucht.
            npm ci
            npx prisma generate
            npx prisma migrate deploy

            # Eigentümerschaft auf den Service-User setzen: der Deploy läuft als root,
            # der systemd-Dienst aber als discord:discord. Ohne das gehören Ordner/
            # Dateien root:root. .env zusätzlich auf 600 beschränken (nur Owner liest).
            chown -R discord:discord /opt/discord_giveaway
            chmod 600 /opt/discord_giveaway/.env

            sudo systemctl restart discord-giveaway
            sudo systemctl --no-pager status discord-giveaway | head -n 5
